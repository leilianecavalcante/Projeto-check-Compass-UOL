<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Desabafe Aqui</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fff0f5;
      text-align: center;
      padding: 40px;
      margin: 0;
    }

    header {
      background-color: #ffe4ec;
      padding: 30px 0;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    h1 {
      color: #b2226b;
      margin-bottom: 10px;
    }

    p.intro {
      font-size: 18px;
      color: #555;
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.6;
    }

    textarea {
      width: 90%;
      max-width: 700px;
      height: 180px;
      padding: 15px;
      margin-top: 30px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: none;
      background-color: #fffafc;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 17px;
      background-color: #b2226b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #4CAF50;
      box-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
    }

    footer {
      margin-top: 50px;
      padding: 15px;
      background-color: #f8d7e3;
      color: #333;
      text-align: center;
      font-size: 14px;
      border-top: 1px solid #e0b5c4;
      border-radius: 0 0 10px 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Desabafe Aqui</h1>
    <p class="intro">
      Seja bem-vindo ao seu espaço de alívio emocional.<br>
      Aqui você pode soltar o peso do coração, sem julgamentos, sem pressa. 💬<br>
      Lembre-se: tudo o que você sente é válido. Escrever pode aliviar.
    </p>
  </header>

  <section>
    <form>
      <textarea placeholder="Escreva o que está sentindo... Seja sincero com você mesmo."></textarea><br>
      <button type="submit">Enviar Desabafo</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 Desabafe Aqui. Todos os direitos reservados.</p>
    <p>Você não está sozinho. 💗</p>
  </footer>

</body>
</html>
